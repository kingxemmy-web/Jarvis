<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jarvis</title>
<style>
  body { margin:0; background:#0b1220; color:#fff; font-family:-apple-system,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
  h1 { margin:0 0 10px; letter-spacing:4px; }
  #orb { width:140px; height:140px; border-radius:50%; border:none; background:radial-gradient(circle,#4cc9f0,#235A91); color:#fff; font-size:16px; box-shadow:0 0 30px #4cc9f0; }
  #orb.on { animation:pulse 1s infinite; background:radial-gradient(circle,#ff7b7b,#8E311F); box-shadow:0 0 40px #ff7b7b; }
  @keyframes pulse { 50% { transform:scale(1.1); } }
  #said, #reply { max-width:420px; text-align:center; margin-top:18px; min-height:24px; line-height:1.4; }
  #said { opacity:.6; }
  #key { margin-top:24px; font-size:12px; opacity:.5; background:none; border:1px solid #555; color:#fff; padding:6px 10px; border-radius:8px; }
</style>
</head>
<body>
<h1>JARVIS</h1>
<button id="orb">Tap to talk</button>
<div id="said"></div>
<div id="reply"></div>
<button id="key">Set API key</button>
<script>
(function () {
  var orb = document.getElementById('orb'), said = document.getElementById('said'), reply = document.getElementById('reply');
  var history = [];
  var SYSTEM = 'You are Jarvis, a friendly voice assistant for King Xemmy. Reply in one or two short spoken sentences, no lists or markdown.';

  function getKey() {
    var k = localStorage.getItem('jarvis_key');
    if (!k) { k = prompt('Paste your Anthropic API key'); if (k) localStorage.setItem('jarvis_key', k.trim()); }
    return k;
  }
  document.getElementById('key').onclick = function () {
    var k = prompt('Paste your Anthropic API key'); if (k) localStorage.setItem('jarvis_key', k.trim());
  };

  function speak(text) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 1; u.lang = 'en-GB';
    speechSynthesis.speak(u);
  }

  async function ask(text) {
    var key = getKey(); if (!key) return;
    history.push({ role: 'user', content: text });
    reply.textContent = 'Thinking...';
    try {
      var r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 300, system: SYSTEM, messages: history })
      });
      var data = await r.json();
      if (data.error) { reply.textContent = 'Error: ' + data.error.message; return; }
      var out = data.content[0].text;
      history.push({ role: 'assistant', content: out });
      reply.textContent = out;
      speak(out);
    } catch (e) { reply.textContent = 'Something went wrong: ' + e.message; }
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { reply.textContent = 'Speech recognition is not supported in this browser. Use Safari.'; return; }
  var rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false;
  rec.onstart = function () { orb.classList.add('on'); orb.textContent = 'Listening...'; };
  rec.onend = function () { orb.classList.remove('on'); orb.textContent = 'Tap to talk'; };
  rec.onresult = function (e) { var t = e.results[0][0].transcript; said.textContent = 'You: ' + t; ask(t); };
  rec.onerror = function (e) { reply.textContent = 'Mic problem: ' + e.error; };
  orb.onclick = function () { speechSynthesis.cancel(); try { rec.start(); } catch (x) {} };
})();
</script>
</body>
</html>
